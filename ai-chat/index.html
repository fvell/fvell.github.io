<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MindEase AI 心理聊天</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="side-panel" aria-label="会话设置">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">M</div>
          <div>
            <p class="eyebrow">MindEase</p>
            <h1>AI 心理学聊天</h1>
          </div>
        </div>

        <section class="panel-section">
          <h2>今天的状态</h2>
          <div class="mood-grid" id="moodGrid" role="group" aria-label="选择情绪">
            <button class="mood-chip is-active" type="button" data-mood="焦虑">焦虑</button>
            <button class="mood-chip" type="button" data-mood="低落">低落</button>
            <button class="mood-chip" type="button" data-mood="压力大">压力大</button>
            <button class="mood-chip" type="button" data-mood="迷茫">迷茫</button>
          </div>
        </section>

        <section class="panel-section">
          <h2>支持方式</h2>
          <div class="mode-list" id="modeList" role="group" aria-label="选择支持方式">
            <button class="mode-button is-active" type="button" data-mode="倾听">
              <span>倾听</span>
              <small>整理情绪与事实</small>
            </button>
            <button class="mode-button" type="button" data-mode="认知重构">
              <span>认知重构</span>
              <small>识别自动想法</small>
            </button>
            <button class="mode-button" type="button" data-mode="行动计划">
              <span>行动计划</span>
              <small>拆成可执行一步</small>
            </button>
          </div>
        </section>

        <section class="panel-section">
          <h2>安全边界</h2>
          <p class="note">
            这里提供自助式情绪支持，不能替代心理咨询、诊断或医疗建议。若你有伤害自己或他人的风险，请立即联系当地紧急服务或可信任的人。
          </p>
        </section>
      </aside>

      <section class="chat-panel" aria-label="聊天窗口">
        <header class="chat-header">
          <div>
            <p class="eyebrow">对话室</p>
            <h2>把当下的感受说出来</h2>
          </div>
          <button class="ghost-button" id="clearChat" type="button">清空</button>
        </header>

        <div class="quick-prompts" aria-label="快捷提问">
          <button type="button" data-prompt="我最近总是担心事情会变糟，停不下来。">焦虑循环</button>
          <button type="button" data-prompt="我感觉自己什么都做不好，很沮丧。">自我否定</button>
          <button type="button" data-prompt="我明天有重要事情，现在压力很大。">压力管理</button>
        </div>

        <div class="messages" id="messages" aria-live="polite">
          <article class="message assistant">
            <div class="avatar">AI</div>
            <div class="bubble">
              <p>我会先帮你把感受说清楚，再一起找一个很小但可执行的下一步。你现在最想聊哪件事？</p>
            </div>
          </article>
        </div>

        <form class="composer" id="chatForm">
          <label class="sr-only" for="messageInput">输入消息</label>
          <textarea id="messageInput" rows="2" placeholder="写下你的感受、想法或正在困扰你的事情..." required></textarea>
          <button type="submit">发送</button>
        </form>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
