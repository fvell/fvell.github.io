<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="填写个人现状，生成涵盖学习、职业、健康、财务与生活的行动报告。">
  <title>个人信息 AI 化</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <a class="brand" href="#input" aria-label="个人信息 AI 化首页">
      <span class="brand-mark"><i data-lucide="compass" aria-hidden="true"></i></span>
      <span>个人信息 AI 化</span>
    </a>
    <div class="header-actions">
      <span class="save-state" id="save-state"><i data-lucide="circle-check" aria-hidden="true"></i> 本机自动保存</span>
      <button class="icon-button" id="reset-button" type="button" aria-label="清空全部信息" data-tooltip="清空全部信息">
        <i data-lucide="rotate-ccw" aria-hidden="true"></i>
      </button>
    </div>
  </header>

  <main>
    <section class="input-view" id="input" aria-labelledby="input-title">
      <div class="intro">
        <p class="eyebrow">PERSONAL AI</p>
        <h1 id="input-title">填写信息，生成规划</h1>
      </div>

      <section class="import-panel" aria-labelledby="import-title">
        <div class="import-heading">
          <span class="import-icon"><i data-lucide="file-scan" aria-hidden="true"></i></span>
          <div>
            <h2 id="import-title">从文件智能提取</h2>
            <p>拖入资料，自动预填</p>
          </div>
        </div>
        <label class="drop-zone" id="drop-zone" for="file-input">
          <input id="file-input" type="file" accept=".pdf,.docx,.txt,.md,.json" multiple>
          <i data-lucide="upload-cloud" aria-hidden="true"></i>
          <strong>把文件拖到这里</strong>
          <span>PDF · DOCX · TXT · MD · JSON</span>
        </label>
        <div class="import-result" id="import-result" hidden>
          <div>
            <strong id="import-status">正在提取信息</strong>
            <p id="import-detail"></p>
          </div>
          <button class="secondary-button" id="clear-files" type="button"><i data-lucide="x" aria-hidden="true"></i>清除导入</button>
        </div>
      </section>

      <form id="planner-form">
        <nav class="section-nav" aria-label="信息填写进度">
          <a href="#basic"><span>01</span>基本状态</a>
          <a href="#direction"><span>02</span>目标方向</a>
          <a href="#growth"><span>03</span>学习职业</a>
          <a href="#foundation"><span>04</span>生活底盘</a>
          <a href="#reflection"><span>05</span>自我判断</a>
        </nav>

        <fieldset class="form-section" id="basic">
          <legend><span>01</span> 基本状态</legend>
          <div class="form-grid">
            <label class="field">
              <span>怎么称呼你 <em>选填</em></span>
              <input name="name" type="text" autocomplete="name" placeholder="昵称或名字">
            </label>
            <label class="field">
              <span>年龄或人生阶段</span>
              <input name="stage" type="text" required placeholder="例如：20 岁，大二 / 工作第 3 年">
            </label>
            <label class="field">
              <span>当前身份</span>
              <select name="identity" required>
                <option value="">请选择</option>
                <option>中学生</option>
                <option>大学生</option>
                <option>研究生</option>
                <option>职场人士</option>
                <option>自由职业者</option>
                <option>创业者</option>
                <option>转型或间隔期</option>
                <option>其他</option>
              </select>
            </label>
            <label class="field">
              <span>所在城市或地区 <em>选填</em></span>
              <input name="location" type="text" placeholder="用于判断机会与生活成本">
            </label>
            <label class="field field-wide">
              <span>当前一周可自主安排的时间</span>
              <div class="number-control">
                <input name="weeklyHours" type="number" min="1" max="100" value="12" required>
                <span>小时 / 周</span>
              </div>
            </label>
            <label class="field field-wide">
              <span>补充背景 <em>选填，可由文件自动提取</em></span>
              <textarea name="backgroundNotes" placeholder="重要经历、家庭背景、限制条件或其他会影响规划的信息"></textarea>
            </label>
          </div>
        </fieldset>

        <fieldset class="form-section" id="direction">
          <legend><span>02</span> 目标与方向</legend>
          <div class="form-grid">
            <label class="field field-wide">
              <span>未来 1 至 3 年最重要的目标</span>
              <textarea name="mainGoal" required placeholder="例如：申请研究生、转入某个行业、提高收入、建立稳定生活"></textarea>
            </label>
            <label class="field">
              <span>希望多久看到关键结果</span>
              <select name="horizon" required>
                <option value="90 天">90 天</option>
                <option value="半年">半年</option>
                <option value="1 年" selected>1 年</option>
                <option value="2 至 3 年">2 至 3 年</option>
              </select>
            </label>
            <label class="field">
              <span>目标清晰度</span>
              <select name="clarity" required>
                <option value="clear">比较清晰，缺执行路径</option>
                <option value="options">有几个方向，尚未决定</option>
                <option value="unclear">很模糊，只知道想改变</option>
              </select>
            </label>
            <label class="field field-wide">
              <span>你最看重的三件事</span>
              <input name="values" type="text" required placeholder="例如：成长、健康、自由；稳定、家庭、成就">
            </label>
            <label class="field field-wide">
              <span>当前最难做的决定或最担心的问题</span>
              <textarea name="decision" required placeholder="写清选择、限制和担忧，不需要给出正确答案"></textarea>
            </label>
          </div>
        </fieldset>

        <fieldset class="form-section" id="growth">
          <legend><span>03</span> 学习与职业</legend>
          <div class="form-grid">
            <label class="field">
              <span>专业、行业或主要领域</span>
              <input name="field" type="text" required placeholder="例如：计算机、金融、产品设计">
            </label>
            <label class="field">
              <span>目前自我评价</span>
              <select name="performance" required>
                <option value="strong">在同阶段人群中较强</option>
                <option value="steady" selected>中等或较稳定</option>
                <option value="weak">基础有明显短板</option>
                <option value="unknown">缺少可比较的信息</option>
              </select>
            </label>
            <label class="field field-wide">
              <span>已有技能与可核验成果</span>
              <textarea name="skills" required placeholder="课程、证书、作品、项目、实习、工作结果、语言成绩等；请注明真实程度"></textarea>
            </label>
            <label class="field field-wide">
              <span>想发展的方向</span>
              <input name="careerDirection" type="text" required placeholder="可填写 1 至 3 个方向，并说明倾向">
            </label>
            <label class="field field-wide">
              <span>当前最大短板</span>
              <textarea name="growthGap" required placeholder="例如：没有作品、经验不足、表达弱、基础课薄弱、方向摇摆"></textarea>
            </label>
          </div>
        </fieldset>

        <fieldset class="form-section" id="foundation">
          <legend><span>04</span> 健康、财务与关系</legend>
          <div class="form-grid">
            <label class="field">
              <span>平均睡眠</span>
              <select name="sleep" required>
                <option value="under6">不足 6 小时</option>
                <option value="6to7">6 至 7 小时</option>
                <option value="7to9" selected>7 至 9 小时</option>
                <option value="over9">超过 9 小时</option>
              </select>
            </label>
            <label class="field range-field">
              <span>近期精力 <output id="energy-output">6 / 10</output></span>
              <input name="energy" id="energy" type="range" min="1" max="10" value="6">
            </label>
            <label class="field">
              <span>运动频率</span>
              <select name="exercise" required>
                <option value="none">几乎没有</option>
                <option value="some" selected>每周 1 至 2 次</option>
                <option value="regular">每周 3 次及以上</option>
              </select>
            </label>
            <label class="field range-field">
              <span>近期压力 <output id="stress-output">5 / 10</output></span>
              <input name="stress" id="stress" type="range" min="1" max="10" value="5">
            </label>
            <label class="field field-wide">
              <span>健康状况或生活限制 <em>选填</em></span>
              <textarea name="health" placeholder="只写影响计划的情况；本报告不提供诊断或治疗意见"></textarea>
            </label>
            <label class="field">
              <span>目前财务状态</span>
              <select name="finance" required>
                <option value="dependent">主要依靠家庭支持</option>
                <option value="tight">收入基本覆盖支出</option>
                <option value="stable" selected>有结余或储蓄</option>
                <option value="pressure">有债务或明显压力</option>
              </select>
            </label>
            <label class="field">
              <span>应急资金</span>
              <select name="emergency" required>
                <option value="none">不足 1 个月支出</option>
                <option value="short">1 至 3 个月支出</option>
                <option value="ready" selected>3 个月以上支出</option>
                <option value="unknown">不清楚</option>
              </select>
            </label>
            <label class="field field-wide">
              <span>家庭、伴侣、朋友或社交现状</span>
              <textarea name="relationships" required placeholder="哪些关系在支持你，哪些关系或社交问题正在消耗你"></textarea>
            </label>
          </div>
        </fieldset>

        <fieldset class="form-section" id="reflection">
          <legend><span>05</span> 自我判断</legend>
          <div class="form-grid">
            <label class="field field-wide">
              <span>你的优势</span>
              <textarea name="strengths" required placeholder="写 2 至 5 条，并尽量附上证据"></textarea>
            </label>
            <label class="field field-wide">
              <span>反复出现的坏习惯或执行障碍</span>
              <textarea name="habits" required placeholder="例如：拖延、计划过满、熬夜、容易被新方向吸引"></textarea>
            </label>
            <label class="field field-wide">
              <span>你理想中的普通一天</span>
              <textarea name="idealDay" required placeholder="不写宏大成就，写你真正愿意长期重复的生活"></textarea>
            </label>
          </div>
        </fieldset>

        <div class="submit-band">
          <div>
            <strong>生成个人规划</strong>
          </div>
          <button class="primary-button" type="submit">
            <i data-lucide="sparkles" aria-hidden="true"></i>
            生成报告
          </button>
        </div>
      </form>
    </section>

    <section class="report-view" id="report" aria-labelledby="report-title" hidden>
      <div class="report-toolbar">
        <div>
          <p class="eyebrow">PERSONAL REPORT</p>
          <h2 id="report-title">你的个人发展报告</h2>
          <p id="report-date"></p>
        </div>
        <div class="toolbar-actions">
          <button class="secondary-button" id="edit-button" type="button"><i data-lucide="pencil" aria-hidden="true"></i>修改信息</button>
          <button class="secondary-button" id="print-button" type="button"><i data-lucide="printer" aria-hidden="true"></i>打印报告</button>
        </div>
      </div>

      <div class="report-summary" id="report-summary"></div>

      <section class="report-section executive-section">
        <div class="section-kicker">01 / 优先级</div>
        <h3>现在最重要的三件事</h3>
        <p class="executive-copy" id="executive-copy"></p>
        <div class="priority-grid" id="priority-grid"></div>
      </section>

      <section class="report-section">
        <div class="section-kicker">02 / 未来 90 天</div>
        <h3>90 天路线</h3>
        <div class="timeline" id="timeline"></div>
      </section>

      <section class="report-section">
        <div class="section-kicker">03 / 全维度建议</div>
        <h3>六个生活系统</h3>
        <div class="domain-list" id="domain-list"></div>
      </section>

      <section class="report-section">
        <div class="section-kicker">04 / 每周运行方式</div>
        <h3>每周时间分配</h3>
        <div class="week-layout" id="week-layout"></div>
      </section>

      <section class="report-section warning-section">
        <div class="section-kicker">05 / 提醒</div>
        <h3>保持可持续</h3>
        <ul class="check-list" id="guardrails"></ul>
      </section>

      <div class="report-footer-actions">
        <button class="primary-button" id="regenerate-button" type="button"><i data-lucide="refresh-cw" aria-hidden="true"></i>按当前信息重新生成</button>
        <a class="text-link" href="#input">返回顶部</a>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module">
    import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs';
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';
    window.pdfjsLib = pdfjsLib;
    window.dispatchEvent(new Event('pdfjs-ready'));
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
